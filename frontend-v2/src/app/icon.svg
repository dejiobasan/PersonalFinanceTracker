<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="55%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="flap-grad" x1="14" y1="16" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" />
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" />

  <!-- Top Card / Bill peeking out of Wallet -->
  <path
    d="M17 22V19C17 16.7909 18.7909 15 21 15H41C43.2091 15 45 16.7909 45 19V22"
    stroke="url(#flap-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Main Wallet Body -->
  <rect
    x="13"
    y="22"
    width="38"
    height="27"
    rx="6"
    fill="#FFFFFF"
    fill-opacity="0.12"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Wallet Clasp Pocket -->
  <path
    d="M39 31.5H51V39.5H39C36.7909 39.5 35 37.7091 35 35.5C35 33.2909 36.7909 31.5 39 31.5Z"
    fill="#1E3A8A"
    stroke="#FFFFFF"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- Emerald Indicator Dot inside Clasp -->
  <circle cx="40.5" cy="35.5" r="2.2" fill="#34D399" />
</svg>

